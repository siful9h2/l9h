# Skip a deploy when a push only changes files that aren't part of the public site
# (agent notes, changelog, calendar, tools). Each real production deploy uses Netlify credits.
[build]
  publish = "."
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)CHANGELOG.md' ':(exclude)CLAUDE.md' ':(exclude)blog-calendar.json' ':(exclude)tools/' ':(exclude)README.md'"
